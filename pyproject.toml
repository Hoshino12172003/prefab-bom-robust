[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prefab-bom-robust"
version = "0.1.0"
description = "Exact small-instance validation for a multi-tier supply-risk BOM model"
requires-python = ">=3.10"
dependencies = ["gurobipy>=11"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
